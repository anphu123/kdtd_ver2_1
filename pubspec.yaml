name: kdtd_ver2_1
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
  device_info_plus:
  battery_plus:
  connectivity_plus:
  network_info_plus:
  flutter_blue_plus :
  nfc_manager :
  sensors_plus:
  geolocator :
  vibration:
  camera:
  local_auth:
  permission_handler :
  audioplayers :
  record:
  proximity_sensor :
  path_provider:
  http:

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0



  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4





flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/diag_rules.json
    - assets/diag_thresholds.json

# Cấu hình FlutterGen — sinh mã tham chiếu asset kiểu an toàn (type-safe)
# vào lib/gen/, thay vì gõ tay chuỗi đường dẫn "assets/...".
flutter_gen:
  output: lib/gen/
































flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon.png"

